[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-bot"
version = "0.2.0"
description = "Official Hyperliquid HTTP+WS HIP-3 bot for EntropyIO (io:ANTH, io:SNDK)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "entropy-bot" }]
dependencies = [
    "hyperliquid-python-sdk==0.24.0",
    "eth-account==0.13.7",
    "eth-utils==5.3.1",
    "msgpack==1.2.3",
    "requests==2.34.2",
    "websocket-client==1.9.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
entropy-bot = "entropy_bot.cli:main"

[tool.setuptools.packages.find]
include = ["entropy_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
